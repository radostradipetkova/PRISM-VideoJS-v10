name: PRISM genuine screen recording (one-off)
on:
  push:
    paths:
      - .github/workflows/prism-video-record-oneoff.yml
      - scripts/record-showcase-oneoff.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser capture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb
          npm install --no-save playwright-core@1.56.1
          which google-chrome || true
          ffmpeg -version | head -1
      - name: Record real PRISM player UI, Optical Loupe, Optical Index and Live Action
        run: xvfb-run --server-args='-screen 0 1920x1080x24 -ac' node scripts/record-showcase-oneoff.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Validate genuine captures
        run: |
          ls -lh showcase-recordings/
          for file in showcase-recordings/*.mp4; do
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,duration -of csv=p=0 "$file"
          done
      - name: Upload source screen recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PRISM-GENUINE-INTERACTION-CAPTURES
          path: showcase-recordings/
          if-no-files-found: warn
          retention-days: 3
