name: PRISM release checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media inspection tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Test the project
        run: npm test
      - name: Assemble public static site
        run: npm run build
      - name: Upload the deployable site
        uses: actions/upload-artifact@v4
        with:
          name: prism-static-site
          path: dist/
