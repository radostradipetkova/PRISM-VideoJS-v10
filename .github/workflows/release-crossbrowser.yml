name: PRISM cross-browser release verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'skin/**'
      - 'src/**'
      - 'examples/**'
      - 'index.html'
      - 'assets/**'
      - 'worker/**'
      - 'wrangler.toml'
      - 'tests/**'
      - '.github/workflows/release-crossbrowser.yml'
  pull_request:
    paths:
      - 'skin/**'
      - 'src/**'
      - 'examples/**'
      - 'index.html'
      - 'assets/**'
      - 'worker/**'
      - 'wrangler.toml'
      - 'tests/**'

jobs:
  browser:
    name: '${{ matrix.browser }} — real Video.js playback'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: python -m pip install playwright==1.57.0 pillow
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Install FFmpeg media tools for video tests
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - run: npm test
      - run: npm run build
      - name: Verify light/dark footage contrast and reduced motion
        if: matrix.browser == 'chromium'
        run: python tests/release_contrast_browser.py
      - run: python tests/release_crossbrowser.py --browser ${{ matrix.browser }}
      - name: Validate production smoke-test syntax
        run: python -m py_compile tests/optimized_release_browser.py
      - name: Smoke-test optimized dist player, controls and mobile layout
        run: python tests/optimized_release_browser.py --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'prism-release-${{ matrix.browser }}'
          path: |
            release-reports/release-${{ matrix.browser }}.json
            release-reports/release-${{ matrix.browser }}-failure.png
            RELEASE-CONTRAST-RESULTS.json
            release-contrast-*.png
          if-no-files-found: ignore
