name: Prepare genuine Live Action storyboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-liveaction-storyboard.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure FFmpeg installed
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Fetch full CC BY Blender film
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/film"
          VIDEO="${RUNNER_TEMP}/film/tears-of-steel-source.mp4"
          curl -fLsS --retry 3 --retry-delay 6 --max-time 1050 -o "$VIDEO" \
            "https://video.blender.org/download/web-videos/8533ea43-4271-4a57-9694-e9d0b35e1aa1-720.mp4" || \
          curl -fLsS --retry 3 --retry-delay 6 --max-time 1050 -o "$VIDEO" \
            "https://download.blender.org/demo/movies/ToS/tears_of_steel_720p.mov"
          test "$(stat -c '%s' "$VIDEO")" -gt 10000000
          echo "VIDEO_SOURCE=$VIDEO" >> "$GITHUB_ENV"
      - name: Extract genuine timed frames
        run: node scripts/generate-liveaction-storyboard.mjs --input="${{ env.VIDEO_SOURCE }}"
      - name: Validate generated storyboard
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import {readFileSync, statSync} from "node:fs";
            const vtt=readFileSync("assets/tears-of-steel-full-storyboard.vtt","utf8");
            const cues=(vtt.match(/#xywh=/g)||[]).length;
            if(!vtt.startsWith("WEBVTT")||cues<30||cues>1500)throw Error("Invalid storyboard cues "+cues);
            if(statSync("assets/tears-of-steel-full-storyboard.jpg").size<10000)throw Error("Bad sprite");
            console.log("Verified "+cues+" real frame previews");
          '
      - name: Commit licensed generated assets to PRISM
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tears-of-steel-full-storyboard.jpg assets/tears-of-steel-full-storyboard.vtt
          if ! git diff --cached --quiet; then
            git commit -m "Add full-film Tears of Steel timed storyboard frames"
            git push origin HEAD:main
          else
            echo "Storyboard already current"
          fi
